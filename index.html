<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<title>꼬리소설</title>
<style>
:root{--g:#26734d;--bg:#fffaf3;--c:#fff;--l:#ece7df;--m:#778079;--t:#202520}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:8;background:#fffaf3;border-bottom:1px solid var(--l)}
.topin{max-width:720px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:21px}
.logo b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--g);color:#fff;margin-right:8px}
.wrap{max-width:720px;margin:auto;padding:16px 16px 104px}
.hero{padding:22px;border-radius:25px;background:#e9f5e9;border:1px solid #dbeade}
.hero h1{font-size:27px;line-height:1.2;margin:0 0 8px}
.hero p{font-size:13px;line-height:1.55;color:#58635c;margin:0}
.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:850}
.primary{background:var(--g);color:#fff}
.soft{background:#e2f3e9;color:#185d3d}
.ghost{background:#fff;border:1px solid var(--l)}
.actions{display:flex;gap:8px;margin-top:15px}
.sec{margin-top:20px}
.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}
.head h2{font-size:18px;margin:0}
.muted{font-size:12px;color:var(--m)}
.pills{display:flex;gap:7px;overflow:auto;padding-bottom:8px}
.pill{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}
.pill.on{background:#202520;color:#fff}
.list{display:grid;gap:10px}
.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:15px}
.card button{all:unset;display:block;width:100%;cursor:pointer}
.badge{float:right;background:#fff0df;color:#80512a;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}
.title{font-size:16px;font-weight:900}
.desc{font-size:13px;color:#666e68;line-height:1.45;margin-top:5px}
.meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--m);font-size:11px;margin-top:10px}
.bottom{position:fixed;z-index:10;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,720px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--l)}
.nav{border:0;background:none;color:#777d78;font-size:11px;font-weight:800}
.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.nav.on{color:var(--g)}
.nav.write i{width:42px;height:42px;display:grid;place-items:center;background:var(--g);color:#fff;border-radius:15px;margin:-24px auto 2px;font-size:28px}
.search{width:100%;border:1px solid var(--l);background:#fff;border-radius:13px;padding:11px;margin-bottom:12px}
.reader,.form{background:#fff;border:1px solid var(--l);border-radius:21px;padding:18px}
.reader h1{font-size:26px;line-height:1.25;margin:0}
.body{white-space:pre-wrap;font-size:16px;line-height:1.85;margin-top:22px}
.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.act{border:1px solid var(--l);background:#fff;border-radius:13px;padding:11px 5px;font-size:11px;font-weight:800}
.act b{display:block;font-size:18px}
.back{border:1px solid var(--l);background:#fff;width:39px;height:39px;border-radius:12px;margin-bottom:12px}
.tree{border-left:2px solid #cce5d7;padding-left:12px;display:grid;gap:8px}
.node{border:1px solid var(--l);background:#fff;border-radius:13px;padding:11px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:850;font-size:13px;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--l);border-radius:13px;padding:12px;background:#fff}
.field textarea{min-height:220px;resize:vertical;line-height:1.7}
.commentbox{display:flex;gap:7px}
.commentbox input{flex:1;min-width:0;border:1px solid var(--l);border-radius:13px;padding:11px}
.comment{border:1px solid var(--l);background:#fff;border-radius:13px;padding:11px;margin-top:7px}
.comment small{color:var(--m)}
.notice{font-size:12px;line-height:1.5;color:#606862;background:#f2f6f4;border-radius:13px;padding:12px}
.empty{text-align:center;color:var(--m);padding:36px 10px}
.fatal{margin:16px auto;max-width:720px;padding:14px;border-radius:14px;background:#fff3cd;border:1px solid #ffe69c;font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="logo"><b>🌱</b>꼬리소설</div>
    <button class="btn ghost" id="randomTop" type="button">🎲</button>
  </div>
</header>

<div id="app">
  <!-- JS가 죽어도 이 홈 화면은 그대로 보임 -->
  <main class="wrap">
    <section class="hero">
      <h1>읽다가 마음에 들면<br>네가 다음 화를 써라.</h1>
      <p>로그인 없이 쓰고, 누구나 꼬리를 붙이는 익명 공동창작 놀이터.</p>
      <div class="actions">
        <button class="btn primary" type="button">첫 이야기 쓰기</button>
        <button class="btn soft" type="button">🎲 랜덤 읽기</button>
      </div>
    </section>
    <section class="sec">
      <div class="head"><h2>실시간 인기</h2><span class="muted">로컬 MVP</span></div>
      <div class="list">
        <div class="card"><span class="badge">SF</span><div class="title">문이 열리지 않는 우주정거장</div><div class="desc">교신이 끊긴 궤도 정거장에서 혼자 깨어난 정비사의 이야기.</div><div class="meta"><span>익명 1420</span><span>👁 3.3K</span><span>❤️ 294</span><span>🌱 2</span></div></div>
        <div class="card"><span class="badge">판타지</span><div class="title">용사가 퇴근했다</div><div class="desc">마왕성 앞에서 정시퇴근을 선언한 용사의 이야기.</div><div class="meta"><span>구름사탕</span><span>👁 2.2K</span><span>❤️ 410</span></div></div>
      </div>
    </section>
  </main>
</div>

<nav class="bottom" id="bottomNav">
  <button class="nav on" data-view="home"><i>🏠</i>홈</button>
  <button class="nav" data-view="find"><i>🧭</i>발견</button>
  <button class="nav write" data-view="write"><i>＋</i>쓰기</button>
  <button class="nav" data-view="mine"><i>🪴</i>내 작품</button>
</nav>

<noscript><div class="fatal">JavaScript가 꺼져 있습니다. Safari 설정에서 JavaScript를 켜주세요.</div></noscript>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "kkori_mobile_safe_v1";
  var MINE_KEY = "kkori_mine_safe_v1";
  var genres = ["판타지","SF","로맨스","공포","무협","미스터리","대체역사","일상","코미디","기타"];
  var tailTypes = ["다음 화","다른 결말","IF 분기","패러디","개그화","스핀오프","다른 등장인물 시점","리메이크","세계관 확장","기타"];

  function seed() {
    return [
      {id:"a",p:null,root:"a",type:null,title:"문이 열리지 않는 우주정거장",genre:"SF",pen:"익명 1420",desc:"교신이 끊긴 궤도 정거장에서 혼자 깨어난 정비사의 이야기.",body:"경고등은 세 번 깜빡이고 꺼졌다.\n\n지구는 창밖에서 너무 조용했다.\n\n“관제, 들리면 대답해.”\n\n대답 대신 4번 도킹 포트에서 노크 소리가 났다.\n\n세 번. 두 번. 한 번.\n\n나는 렌치를 들고 문 앞에 섰다. 손잡이는 안쪽에서 천천히 돌아가고 있었다.",views:3280,likes:294,date:Date.now()-500000000,comments:[["익명 3912","이거 다음 장면 너무 궁금한데 여기서 끊는 건 반칙 아님?"]]},
      {id:"b",p:"a",root:"a",type:"다음 화",title:"4번 도킹 포트의 손님",genre:"SF",pen:"무명",desc:"문을 연 뒤 실제로 들어온 것은 사람이 아니었다.",body:"문이 열렸다.\n\n산소가 빠져나가는 소리 대신 종이가 바닥에 떨어지는 소리가 났다.\n\n종이에는 단 한 줄만 적혀 있었다.\n\n“너는 세 번째다.”",views:6120,likes:870,date:Date.now()-300000000,comments:[]},
      {id:"c",p:"a",root:"a",type:"개그화",title:"노크한 놈이 배달기사였다",genre:"코미디",pen:"익명 0044",desc:"궤도상 배달 지연에 화가 난 우주 배달기사.",body:"문을 열자 배달기사가 서 있었다.\n\n“고객님, 공동현관 비밀번호를 안 적으시면 어떡합니까.”\n\n나는 지구를 가리켰다.\n\n“저기 전쟁 났는데요.”\n\n“그건 제 배송평가랑 상관없습니다.”",views:4980,likes:731,date:Date.now()-200000000,comments:[["익명 9901","이딴 전개를 왜 넣은 거임? 개웃기네 ㅋㅋ"]]},
      {id:"d",p:null,root:"d",type:null,title:"용사가 퇴근했다",genre:"판타지",pen:"구름사탕",desc:"마왕성 앞에서 정시퇴근을 선언한 용사의 이야기.",body:"“오늘은 여기까지.”\n\n용사는 검을 칼집에 넣었다.\n\n마왕이 자리에서 일어났다.\n\n“지금 결전 중인데?”\n\n“제 근무시간은 여섯 시까지입니다.”",views:2230,likes:410,date:Date.now()-400000000,comments:[]}
    ];
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : seed();
    } catch (e) {
      return seed();
    }
  }

  var data = loadData();
  var state = {view:"home", selected:null, query:"", genre:"전체", rank:"실시간"};

  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function fmt(n) {
    return n > 999 ? (n/1000).toFixed(1) + "K" : String(n);
  }

  function childrenOf(id) {
    var out = [], i;
    for (i=0;i<data.length;i++) if (data[i].p === id) out.push(data[i]);
    return out;
  }

  function descendantCount(id) {
    var count = 0, queue = [id], cur, kids, i;
    while (queue.length) {
      cur = queue.pop();
      kids = childrenOf(cur);
      for (i=0;i<kids.length;i++) { count++; queue.push(kids[i].id); }
    }
    return count;
  }

  function getStory(id) {
    var i;
    for (i=0;i<data.length;i++) if (data[i].id === id) return data[i];
    return null;
  }

  function cardHTML(s, number) {
    return '<div class="card"><button type="button" data-story="'+esc(s.id)+'">'+
      '<span class="badge">'+esc(s.type || s.genre)+'</span>'+
      '<div class="title">'+(number ? number+'. ' : '')+esc(s.title)+'</div>'+
      '<div class="desc">'+esc(s.desc)+'</div>'+
      '<div class="meta"><span>'+esc(s.pen)+'</span><span>👁 '+fmt(s.views)+'</span><span>❤️ '+fmt(s.likes)+'</span><span>🌱 '+descendantCount(s.id)+'</span></div>'+
      '</button></div>';
  }

  function homeHTML() {
    var arr = [], i, s, cards="", genreButtons="", rankButtons="";
    for (i=0;i<data.length;i++) {
      s=data[i];
      if (s.p) continue;
      if (state.query && (s.title+s.desc+s.genre+s.pen).indexOf(state.query) === -1) continue;
      if (state.genre !== "전체" && s.genre !== state.genre) continue;
      arr.push(s);
    }
    arr.sort(function(a,b){
      if (state.rank === "신작") return b.date-a.date;
      if (state.rank === "꼬리") return descendantCount(b.id)-descendantCount(a.id);
      return (b.views+b.likes*3)-(a.views+a.likes*3);
    });
    for(i=0;i<arr.length;i++) cards += cardHTML(arr[i],i+1);
    ["실시간","신작","꼬리"].forEach(function(x){
      rankButtons += '<button class="pill '+(state.rank===x?'on':'')+'" data-rank="'+x+'">'+(x==="꼬리"?"🌱 꼬리 많은 작품":x)+'</button>';
    });
    ["전체"].concat(genres).forEach(function(x){
      genreButtons += '<button class="pill '+(state.genre===x?'on':'')+'" data-genre="'+x+'">'+x+'</button>';
    });
    return '<main class="wrap">'+
      '<section class="hero"><h1>읽다가 마음에 들면<br>네가 다음 화를 써라.</h1><p>로그인 없이 쓰고, 누구나 꼬리를 붙이는 익명 공동창작 놀이터.</p>'+
      '<div class="actions"><button class="btn primary" data-view="write">첫 이야기 쓰기</button><button class="btn soft" data-random="1">🎲 랜덤 읽기</button></div></section>'+
      '<section class="sec"><input class="search" id="searchInput" value="'+esc(state.query)+'" placeholder="작품·장르·필명 검색">'+
      '<div class="pills">'+rankButtons+'</div><div class="pills">'+genreButtons+'</div><div class="list">'+(cards || '<div class="empty">작품이 없습니다.</div>')+'</div></section></main>';
  }

  function findHTML() {
    var arr=data.slice().sort(function(a,b){return b.date-a.date;}), cards="", i;
    for(i=0;i<arr.length;i++) cards += cardHTML(arr[i],0);
    return '<main class="wrap"><div class="head"><h2>🧭 발견</h2><span class="muted">원작 '+data.filter(function(x){return !x.p;}).length+' · 꼬리 '+data.filter(function(x){return !!x.p;}).length+'</span></div><div class="list">'+cards+'</div></main>';
  }

  function treeHTML(id) {
    var kids=childrenOf(id), html="", i, k, nested;
    for(i=0;i<kids.length;i++) {
      k=kids[i];
      nested=childrenOf(k.id).length ? '<div class="tree" style="margin-top:7px">'+treeHTML(k.id)+'</div>' : '';
      html += '<div class="node" data-story="'+esc(k.id)+'"><b>'+esc(k.title)+'</b><div class="muted">'+esc(k.type)+' · ❤️ '+fmt(k.likes)+' · 👁 '+fmt(k.views)+'</div>'+nested+'</div>';
    }
    return html;
  }

  function storyHTML() {
    var s=getStory(state.selected), kids, comments="", i;
    if(!s) return homeHTML();
    kids=childrenOf(s.id);
    for(i=s.comments.length-1;i>=0;i--) comments += '<div class="comment"><small>'+esc(s.comments[i][0])+'</small><div>'+esc(s.comments[i][1])+'</div></div>';
    return '<main class="wrap"><button class="back" data-view="home">←</button>'+
      '<article class="reader"><h1>'+esc(s.title)+'</h1><div class="meta">'+esc(s.genre)+' · '+esc(s.pen)+' · '+esc(s.p?s.type:"원작")+'</div><div class="body">'+esc(s.body)+'</div></article>'+
      '<div class="triple"><button class="act" data-like="'+esc(s.id)+'"><b>❤️</b>'+fmt(s.likes)+'</button><button class="act" data-comments="1"><b>💬</b>'+s.comments.length+'</button><button class="act" data-tail="'+esc(s.id)+'"><b>🌱</b>'+kids.length+'</button></div>'+
      '<section class="sec"><div class="head"><h2>🌳 이야기 가지</h2><span class="muted">후손 '+descendantCount(s.id)+'개</span></div>'+
      (kids.length?'<div class="tree">'+treeHTML(s.id)+'</div>':'<div class="notice">아직 꼬리가 없습니다. 첫 분기를 만들어보세요.</div>')+
      '<button class="btn primary" style="width:100%;margin-top:10px" data-tail="'+esc(s.id)+'">🌱 이 작품 이어쓰기</button></section>'+
      '<section class="sec" id="comments"><div class="head"><h2>댓글</h2><span class="muted">익명</span></div><div class="commentbox"><input id="commentInput" maxlength="240" placeholder="가볍게 한마디"><button class="btn primary" data-addcomment="'+esc(s.id)+'">등록</button></div>'+
      (comments || '<div class="empty">첫 댓글을 남겨보세요.</div>')+'</section></main>';
  }

  function formHTML(parentId) {
    var p=parentId ? getStory(parentId) : null, options="", i, genreOptions="";
    if(p) for(i=0;i<tailTypes.length;i++) options += '<option>'+esc(tailTypes[i])+'</option>';
    if(!p) for(i=0;i<genres.length;i++) genreOptions += '<option>'+esc(genres[i])+'</option>';
    return '<main class="wrap"><button class="back" data-view="'+(p?'story':'home')+'">←</button><form class="form" id="storyForm">'+
      '<div class="head"><h2>'+(p?'꼬리 소설 쓰기':'새 작품 쓰기')+'</h2><span class="muted">'+(p?esc(p.title):'1분 안에 공개')+'</span></div>'+
      (p?'<div class="field"><label>꼬리 유형</label><select name="type">'+options+'</select></div>':'')+
      '<div class="field"><label>제목 *</label><input name="title" required maxlength="80"></div>'+
      (!p?'<div class="field"><label>장르</label><select name="genre">'+genreOptions+'</select></div>':'')+
      '<div class="field"><label>필명 <span class="muted">선택</span></label><input name="pen" maxlength="30" placeholder="비우면 익명"></div>'+
      '<div class="field"><label>한 줄 소개</label><input name="desc" maxlength="120"></div>'+
      '<div class="field"><label>본문 *</label><textarea name="body" required placeholder="생각난 이야기를 바로 적어보세요."></textarea></div>'+
      '<button class="btn primary" style="width:100%">게시</button></form></main>';
  }

  function mineHTML() {
    var ids=[], arr=[], cards="", i, raw;
    try { raw=localStorage.getItem(MINE_KEY); ids=raw?JSON.parse(raw):[]; } catch(e) {}
    for(i=0;i<data.length;i++) if(ids.indexOf(data[i].id)!==-1) arr.push(data[i]);
    for(i=0;i<arr.length;i++) cards += cardHTML(arr[i],0);
    return '<main class="wrap"><div class="head"><h2>🪴 내 작품</h2><span class="muted">이 Safari에서 작성</span></div><div class="notice">현재 테스트판은 서버 DB 없이 이 브라우저에 저장됩니다.</div><div class="list sec">'+(cards||'<div class="empty">아직 작성한 작품이 없습니다.</div>')+'</div></main>';
  }

  function render() {
    var app=document.getElementById("app");
    if(!app) return;
    if(state.view==="home") app.innerHTML=homeHTML();
    else if(state.view==="find") app.innerHTML=findHTML();
    else if(state.view==="story") app.innerHTML=storyHTML();
    else if(state.view==="write") app.innerHTML=formHTML(null);
    else if(state.view==="tail") app.innerHTML=formHTML(state.selected);
    else if(state.view==="mine") app.innerHTML=mineHTML();
    updateNav();
  }

  function updateNav() {
    var buttons=document.querySelectorAll("#bottomNav .nav"),i;
    for(i=0;i<buttons.length;i++) {
      if(buttons[i].getAttribute("data-view")===state.view) buttons[i].classList.add("on");
      else buttons[i].classList.remove("on");
    }
  }

  function go(view) {
    if(view==="story" && !state.selected) view="home";
    state.view=view;
    window.scrollTo(0,0);
    render();
  }

  function randomStory() {
    if(!data.length) return;
    var s=data[Math.floor(Math.random()*data.length)];
    openStory(s.id);
  }

  function openStory(id) {
    var s=getStory(id);
    if(!s) return;
    s.views++;
    saveData();
    state.selected=id;
    go("story");
  }

  function submitStory(form) {
    var p=state.view==="tail"?getStory(state.selected):null;
    var fd=new FormData(form), id="s"+Date.now()+Math.floor(Math.random()*10000);
    var title=String(fd.get("title")||"").trim();
    var body=String(fd.get("body")||"").trim();
    if(!title || !body) return;
    var story={
      id:id,p:p?p.id:null,root:p?p.root:id,type:p?String(fd.get("type")||"다음 화"):null,
      title:title,genre:p?p.genre:String(fd.get("genre")||"기타"),
      pen:String(fd.get("pen")||"").trim() || ("익명 "+Math.floor(1000+Math.random()*9000)),
      desc:String(fd.get("desc")||"").trim() || "새로운 이야기",
      body:body,views:0,likes:0,date:Date.now(),comments:[]
    };
    data.unshift(story);
    saveData();
    try{
      var raw=localStorage.getItem(MINE_KEY), ids=raw?JSON.parse(raw):[];
      ids.push(id); localStorage.setItem(MINE_KEY,JSON.stringify(ids));
    }catch(e){}
    state.selected=id;
    go("story");
  }

  document.addEventListener("click", function(e){
    var t=e.target;
    while(t && t!==document.body) {
      if(t.getAttribute) {
        if(t.getAttribute("data-view")) { go(t.getAttribute("data-view")); return; }
        if(t.getAttribute("data-story")) { openStory(t.getAttribute("data-story")); return; }
        if(t.getAttribute("data-random")) { randomStory(); return; }
        if(t.getAttribute("data-rank")) { state.rank=t.getAttribute("data-rank"); render(); return; }
        if(t.getAttribute("data-genre")) { state.genre=t.getAttribute("data-genre"); render(); return; }
        if(t.getAttribute("data-like")) { var s=getStory(t.getAttribute("data-like")); if(s){s.likes++;saveData();render();} return; }
        if(t.getAttribute("data-tail")) { state.selected=t.getAttribute("data-tail"); go("tail"); return; }
        if(t.getAttribute("data-comments")) { var c=document.getElementById("comments"); if(c)c.scrollIntoView(); return; }
        if(t.getAttribute("data-addcomment")) {
          var inp=document.getElementById("commentInput"), txt=inp?inp.value.trim():"", cs=getStory(t.getAttribute("data-addcomment"));
          if(txt && cs){cs.comments.push(["익명 "+Math.floor(1000+Math.random()*9000),txt]);saveData();render();}
          return;
        }
      }
      t=t.parentNode;
    }
  });

  document.addEventListener("input", function(e){
    if(e.target && e.target.id==="searchInput") {
      state.query=e.target.value;
      render();
      var input=document.getElementById("searchInput");
      if(input){input.focus(); input.setSelectionRange(input.value.length,input.value.length);}
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target && e.target.id==="storyForm") {
      e.preventDefault();
      submitStory(e.target);
    }
  });

  var randomTop=document.getElementById("randomTop");
  if(randomTop) randomTop.addEventListener("click",randomStory);

  render();
})();
</script>
</body>
</html>
