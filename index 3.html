<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>꼬리소설</title>
<style>
:root{
  --bg:#ffffff;
  --text:#111111;
  --muted:#6b6b6b;
  --line:#e8e8e8;
  --line-strong:#d7d7d7;
  --panel:#fafafa;
  --nav-h:74px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.03em}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px calc(100px + env(safe-area-inset-bottom))}
.sec{margin-top:28px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.head h2{margin:0;font-size:18px;letter-spacing:-.02em}
.muted{font-size:12px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--text);background:var(--bg);border-radius:10px;padding:11px 14px;font-weight:700}
.btn.primary{background:var(--text);color:#fff}
.btn.soft,.btn.ghost{background:#fff;border-color:var(--line-strong);color:var(--text)}
.btn.small{padding:9px 11px;border-radius:8px;font-size:12px}
.pills{display:flex;gap:8px;overflow:auto;padding-bottom:6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600}
.pill.on{background:var(--text);color:#fff;border-color:var(--text)}
.search{width:100%;border:1px solid var(--line-strong);background:#fff;border-radius:10px;padding:12px 13px;margin-bottom:12px;outline:none}
.search:focus,.field input:focus,.field textarea:focus,.field select:focus,.commentbox input:focus{border-color:#111;box-shadow:none}
.list{display:grid;gap:0}
.card{border-top:1px solid var(--line)}
.card:last-child{border-bottom:1px solid var(--line)}
.card button{all:unset;display:block;width:100%;padding:10px 0;cursor:pointer}
.card button:active{opacity:.65}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.title{font-size:15px;font-weight:650;line-height:1.35;letter-spacing:-.015em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.views{font-size:12px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.desc{font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px;max-width:620px}
.meta{display:flex;gap:10px 14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.badge{display:inline-block;border:1px solid var(--line-strong);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:600;color:#4f4f4f;background:#fff;flex:0 0 auto}
.number{color:var(--muted);font-weight:700;margin-right:8px}
.reader,.form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.reader h1{font-size:31px;line-height:1.2;margin:0;letter-spacing:-.04em}
.body{white-space:pre-wrap;font-size:16px;line-height:1.95;margin-top:24px;color:#1b1b1b}
.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.act{border:1px solid var(--line-strong);background:#fff;border-radius:10px;padding:11px 6px;font-size:11px;font-weight:700}
.act b{display:block;font-size:17px;margin-bottom:3px}
.back{border:1px solid var(--line-strong);background:#fff;width:40px;height:40px;border-radius:10px;margin-bottom:12px}
.tree{border-left:1px solid var(--line-strong);padding-left:14px;display:grid;gap:10px}
.node{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px}
.node b{display:block;font-size:14px;line-height:1.5}
.series-head{padding:4px 0 18px;border-bottom:1px solid var(--line)}
.series-head .badge{margin-bottom:9px}
.series-head h1{margin:0;font-size:29px;line-height:1.25;letter-spacing:-.035em}
.episode-list{border-top:1px solid var(--line)}
.episode{border-bottom:1px solid var(--line)}
.episode button{all:unset;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:13px 0;cursor:pointer}
.episode-title{min-width:0;font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.episode-views{font-size:12px;color:var(--muted);white-space:nowrap}
.type-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-choice label{position:relative}
.type-choice input{position:absolute;opacity:0;pointer-events:none}
.type-choice span{display:block;text-align:center;border:1px solid var(--line-strong);border-radius:10px;padding:11px 8px;font-size:13px;font-weight:700}
.type-choice input:checked+span{background:#111;color:#fff;border-color:#111}
.hidden{display:none!important}
.field{margin-bottom:15px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:12px;background:#fff;outline:none}
.field textarea{min-height:220px;resize:vertical;line-height:1.75}
.commentbox{display:flex;gap:8px}
.commentbox input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;outline:none}
.comment{border-top:1px solid var(--line);padding:12px 0}
.comment:last-child{border-bottom:1px solid var(--line)}
.comment small{display:block;color:var(--muted);margin-bottom:6px}
.notice{font-size:12px;line-height:1.65;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.empty{text-align:center;color:var(--muted);padding:36px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.nav{border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;padding:6px 4px}
.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}
.nav.on{color:var(--text)}
.nav.write i{font-size:24px;line-height:1}
.fatal{margin:16px auto;max-width:760px;padding:14px;border-radius:10px;background:#fff7d6;border:1px solid #eedf97;font-size:13px}
.version{margin-top:22px;color:#9a9a9a;font-size:11px;letter-spacing:.03em}
@media (min-width:720px){
  .title{font-size:19px}
  .reader,.form{padding:22px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="logo">꼬리소설</div>
    <button class="btn ghost small" id="randomTop" type="button">랜덤</button>
  </div>
</header>

<div id="app">
  <main class="wrap">
    <section class="sec" style="margin-top:0">
      <div class="pills" style="margin-bottom:8px">
        <button class="pill on" type="button">최신</button>
        <button class="pill" type="button">인기</button>
      </div>
      <div class="list">
        <div class="card"><button type="button"><div class="card-row"><div class="title">문이 열리지 않는 우주정거장</div><div class="views">3.3K</div></div></button></div>
        <div class="card"><button type="button"><div class="card-row"><div class="title">용사가 퇴근했다</div><div class="views">2.2K</div></div></button></div>
      </div>
    </section>
  </main>
</div>

<nav class="bottom" id="bottomNav">
  <button class="nav on" data-view="home"><i>홈</i>Home</button>
  <button class="nav" data-view="find"><i>발견</i>Browse</button>
  <button class="nav write" data-view="write"><i>＋</i>Write</button>
  <button class="nav" data-view="mine"><i>내작품</i>Mine</button>
</nav>

<noscript><div class="fatal">JavaScript가 꺼져 있습니다. Safari 설정에서 JavaScript를 켜주세요.</div></noscript>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "kkori_mobile_safe_v1";
  var MINE_KEY = "kkori_mine_safe_v1";
  var genres = ["판타지","SF","로맨스","공포","무협","미스터리","대체역사","일상","코미디","기타"];
  var tailTypes = ["다음 화","다른 결말","IF 분기","패러디","개그화","스핀오프","다른 등장인물 시점","리메이크","세계관 확장","기타"];

  function seed() {
    return [
      {id:"a",p:null,root:"a",type:null,title:"문이 열리지 않는 우주정거장",genre:"SF",pen:"익명 1420",desc:"교신이 끊긴 궤도 정거장에서 혼자 깨어난 정비사의 이야기.",body:"경고등은 세 번 깜빡이고 꺼졌다.\n\n지구는 창밖에서 너무 조용했다.\n\n“관제, 들리면 대답해.”\n\n대답 대신 4번 도킹 포트에서 노크 소리가 났다.\n\n세 번. 두 번. 한 번.\n\n나는 렌치를 들고 문 앞에 섰다. 손잡이는 안쪽에서 천천히 돌아가고 있었다.",views:3280,likes:294,date:Date.now()-500000000,comments:[["익명 3912","이거 다음 장면 너무 궁금한데 여기서 끊는 건 반칙 아님?"]]},
      {id:"b",p:"a",root:"a",type:"다음 화",title:"4번 도킹 포트의 손님",genre:"SF",pen:"무명",desc:"문을 연 뒤 실제로 들어온 것은 사람이 아니었다.",body:"문이 열렸다.\n\n산소가 빠져나가는 소리 대신 종이가 바닥에 떨어지는 소리가 났다.\n\n종이에는 단 한 줄만 적혀 있었다.\n\n“너는 세 번째다.”",views:6120,likes:870,date:Date.now()-300000000,comments:[]},
      {id:"c",p:"a",root:"a",type:"개그화",title:"노크한 놈이 배달기사였다",genre:"코미디",pen:"익명 0044",desc:"궤도상 배달 지연에 화가 난 우주 배달기사.",body:"문을 열자 배달기사가 서 있었다.\n\n“고객님, 공동현관 비밀번호를 안 적으시면 어떡합니까.”\n\n나는 지구를 가리켰다.\n\n“저기 전쟁 났는데요.”\n\n“그건 제 배송평가랑 상관없습니다.”",views:4980,likes:731,date:Date.now()-200000000,comments:[["익명 9901","이딴 전개를 왜 넣은 거임? 개웃기네 ㅋㅋ"]]},
      {id:"d",p:null,root:"d",type:null,title:"용사가 퇴근했다",genre:"판타지",pen:"구름사탕",desc:"마왕성 앞에서 정시퇴근을 선언한 용사의 이야기.",body:"“오늘은 여기까지.”\n\n용사는 검을 칼집에 넣었다.\n\n마왕이 자리에서 일어났다.\n\n“지금 결전 중인데?”\n\n“제 근무시간은 여섯 시까지입니다.”",views:2230,likes:410,date:Date.now()-400000000,comments:[]}
    ];
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : seed();
    } catch (e) {
      return seed();
    }
  }

  var data = loadData();
  var state = {view:"home", selected:null, query:"", genre:"전체", rank:"최신"};

  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function fmt(n) {
    return n > 999 ? (n/1000).toFixed(1) + "K" : String(n);
  }

  function childrenOf(id) {
    var out = [], i;
    for (i=0;i<data.length;i++) if (data[i].p === id) out.push(data[i]);
    return out;
  }

  function descendantCount(id) {
    var count = 0, queue = [id], cur, kids, i;
    while (queue.length) {
      cur = queue.pop();
      kids = childrenOf(cur);
      for (i=0;i<kids.length;i++) { count++; queue.push(kids[i].id); }
    }
    return count;
  }

  function getStory(id) {
    var i;
    for (i=0;i<data.length;i++) if (data[i].id === id) return data[i];
    return null;
  }

  function isSeriesEpisode(s) {
    return !!(s && s.format === "series" && s.official);
  }

  function isSeriesRoot(s) {
    return !!(isSeriesEpisode(s) && s.episode === 1);
  }

  function seriesEpisodes(seriesId) {
    var out=[], i;
    for(i=0;i<data.length;i++) if(isSeriesEpisode(data[i]) && data[i].seriesId===seriesId) out.push(data[i]);
    out.sort(function(a,b){return a.episode-b.episode;});
    return out;
  }

  function mineIds() {
    try { var raw=localStorage.getItem(MINE_KEY); return raw?JSON.parse(raw):[]; } catch(e) { return []; }
  }

  function ownsStory(id) {
    return mineIds().indexOf(id)!==-1;
  }

  function addMine(id) {
    try {
      var ids=mineIds();
      if(ids.indexOf(id)===-1) ids.push(id);
      localStorage.setItem(MINE_KEY,JSON.stringify(ids));
    } catch(e) {}
  }

  function ensureDemoSeries() {
    if(getStory("demo_series_e1")) return;
    var now=Date.now();
    var demo=[
      {id:"demo_series_e1",p:null,root:"demo_series_e1",format:"series",official:true,seriesId:"demo_series",seriesTitle:"막차는 달로 간다",episode:1,type:null,title:"1화. 막차 승강장",genre:"SF",pen:"익명 0721",desc:"달행 막차에 잘못 올라탄 승객.",body:"막차 안내판에는 목적지가 없었다.\n\n문이 닫히자 차창 밖의 서울이 아래로 멀어졌다.\n\n그제야 방송이 나왔다.\n\n“다음 역은 달입니다.”",views:1840,likes:211,date:now-180000000,comments:[]},
      {id:"demo_series_e2",p:null,root:"demo_series_e1",format:"series",official:true,seriesId:"demo_series",seriesTitle:"막차는 달로 간다",episode:2,type:null,title:"2화. 없는 승객",genre:"SF",pen:"익명 0721",desc:"빈 좌석에 적힌 이름.",body:"내 맞은편 좌석은 비어 있었다.\n\n그런데 좌석표에는 이름이 적혀 있었다.\n\n내 이름이었다.",views:1410,likes:176,date:now-170000000,comments:[]},
      {id:"demo_series_tail",p:"demo_series_e2",root:"demo_series_e1",format:"tail",official:false,seriesId:"demo_series",type:"IF 분기",title:"좌석에 먼저 앉아 있던 나",genre:"SF",pen:"익명 3310",desc:"2화에서 갈라진 짧은 꼬리.",body:"고개를 들자 빈 좌석에 누군가 앉아 있었다.\n\n나였다.\n\n그가 먼저 말했다.\n\n“이번엔 네가 내리는 차례야.”",views:730,likes:92,date:now-165000000,comments:[]},
      {id:"demo_series_e3",p:null,root:"demo_series_e1",format:"series",official:true,seriesId:"demo_series",seriesTitle:"막차는 달로 간다",episode:3,type:null,title:"3화. 종착역",genre:"SF",pen:"익명 0721",desc:"열차가 멈춘 곳.",body:"열차는 달에 도착하지 않았다.\n\n문이 열린 곳은 출발하기 전의 승강장이었다.\n\n시계만 하루 전으로 돌아가 있었다.",views:1080,likes:139,date:now-160000000,comments:[]}
    ];
    data=demo.concat(data);
    saveData();
  }

  function statText(s) {
    return '<span>'+esc(s.pen)+'</span><span>'+fmt(s.views)+' views</span><span>'+fmt(s.likes)+' likes</span><span>'+descendantCount(s.id)+' branches</span>';
  }

  function cardHTML(s, number) {
    var label=isSeriesRoot(s)?s.seriesTitle:s.title;
    var attr=isSeriesRoot(s)?' data-series="'+esc(s.seriesId)+'"':' data-story="'+esc(s.id)+'"';
    var prefix=isSeriesRoot(s)?'<span class="muted" style="margin-right:7px">시리즈</span>':'';
    var views=isSeriesRoot(s)?seriesEpisodes(s.seriesId).reduce(function(sum,x){return sum+x.views;},0):s.views;
    return '<div class="card"><button type="button"'+attr+'>'+
      '<div class="card-row"><div class="title">'+prefix+esc(label)+'</div><div class="views">'+fmt(views)+'</div></div>'+
      '</button></div>';
  }

  function homeHTML() {
    var arr = [], i, s, cards="", rankButtons="";
    for (i=0;i<data.length;i++) {
      s=data[i];
      if (s.p) continue;
      if (isSeriesEpisode(s) && s.episode !== 1) continue;
      arr.push(s);
    }
    arr.sort(function(a,b){
      if (state.rank === "인기") return (b.views+b.likes*3)-(a.views+a.likes*3);
      return b.date-a.date;
    });
    for(i=0;i<arr.length;i++) cards += cardHTML(arr[i],0);
    ["최신","인기"].forEach(function(x){
      rankButtons += '<button class="pill '+(state.rank===x?'on':'')+'" data-rank="'+x+'">'+x+'</button>';
    });
    return '<main class="wrap">'+
      '<section class="sec" style="margin-top:0"><div class="pills" style="margin-bottom:8px">'+rankButtons+'</div><div class="list">'+(cards || '<div class="empty">작품이 없습니다.</div>')+'</div></section></main>';
  }

  function findHTML() {
    var arr=data.slice().sort(function(a,b){return b.date-a.date;}), cards="", i;
    for(i=0;i<arr.length;i++) {
      if(isSeriesEpisode(arr[i]) && arr[i].episode!==1) continue;
      cards += cardHTML(arr[i],0);
    }
    return '<main class="wrap"><div class="head"><h2>Browse</h2><span class="muted">원작 '+data.filter(function(x){return !x.p;}).length+' · 꼬리 '+data.filter(function(x){return !!x.p;}).length+'</span></div><div class="list">'+cards+'</div></main>';
  }

  function treeHTML(id) {
    var kids=childrenOf(id), html="", i, k, nested;
    for(i=0;i<kids.length;i++) {
      k=kids[i];
      nested=childrenOf(k.id).length ? '<div class="tree" style="margin-top:8px">'+treeHTML(k.id)+'</div>' : '';
      html += '<div class="node" data-story="'+esc(k.id)+'"><b>'+esc(k.title)+'</b><div class="meta"><span>'+esc(k.type)+'</span><span>'+fmt(k.likes)+' likes</span><span>'+fmt(k.views)+' views</span></div>'+nested+'</div>';
    }
    return html;
  }

  function seriesHTML() {
    var root=getStory(state.selected), eps=[], rows="", i, total=0;
    if(!root || !isSeriesRoot(root)) return homeHTML();
    eps=seriesEpisodes(root.seriesId);
    for(i=0;i<eps.length;i++) {
      total+=eps[i].views;
      rows += '<div class="episode"><button type="button" data-story="'+esc(eps[i].id)+'"><div class="episode-title">'+esc(eps[i].title)+'</div><div class="episode-views">'+fmt(eps[i].views)+'</div></button></div>';
    }
    return '<main class="wrap"><button class="back" data-view="home">←</button>'+
      '<section class="series-head"><span class="badge">시리즈</span><h1>'+esc(root.seriesTitle)+'</h1><div class="meta"><span>'+esc(root.pen)+'</span><span>'+esc(root.genre)+'</span><span>'+eps.length+'화</span><span>'+fmt(total)+' views</span></div></section>'+
      '<section class="sec"><div class="head"><h2>회차</h2><span class="muted">공식 연재</span></div><div class="episode-list">'+rows+'</div></section>'+
      (ownsStory(root.id)?'<button class="btn primary" style="width:100%;margin-top:18px" data-seriesnext="'+esc(root.id)+'">공식 다음 화 추가</button>':'')+
      '</main>';
  }

  function seriesEpisodeForm(rootId) {
    var root=getStory(rootId), eps=root?seriesEpisodes(root.seriesId):[], next=eps.length+1;
    if(!root || !ownsStory(root.id)) return seriesHTML();
    return '<main class="wrap"><button class="back" data-series="'+esc(root.seriesId)+'">←</button><form class="form" id="seriesEpisodeForm">'+
      '<div class="head"><h2>'+next+'화 쓰기</h2><span class="muted">'+esc(root.seriesTitle)+'</span></div>'+
      '<div class="field"><label>화 제목 *</label><input name="episodeTitle" required maxlength="70" placeholder="예: 새로운 승객"></div>'+
      '<div class="field"><label>본문 *</label><textarea name="body" required></textarea></div>'+
      '<button class="btn primary" style="width:100%">공식 '+next+'화 게시</button></form></main>';
  }

  function storyHTML() {
    var s=getStory(state.selected), kids, comments="", i;
    if(!s) return homeHTML();
    kids=childrenOf(s.id);
    for(i=s.comments.length-1;i>=0;i--) comments += '<div class="comment"><small>'+esc(s.comments[i][0])+'</small><div>'+esc(s.comments[i][1])+'</div></div>';
    var backAttr=isSeriesEpisode(s)?' data-series="'+esc(s.seriesId)+'"':' data-view="home"';
    return '<main class="wrap"><button class="back"'+backAttr+'>←</button>'+
      '<article class="reader"><h1>'+esc(s.title)+'</h1><div class="meta"><span>'+esc(s.genre)+'</span><span>'+esc(s.pen)+'</span><span>'+(isSeriesEpisode(s)?'공식 '+s.episode+'화':(s.p?esc(s.type):'원작'))+'</span></div><div class="body">'+esc(s.body)+'</div></article>'+
      '<div class="triple"><button class="act" data-like="'+esc(s.id)+'"><b>'+fmt(s.likes)+'</b>Likes</button><button class="act" data-comments="1"><b>'+s.comments.length+'</b>Comments</button><button class="act" data-tail="'+esc(s.id)+'"><b>'+kids.length+'</b>Branches</button></div>'+
      '<section class="sec"><div class="head"><h2>Branches</h2><span class="muted">후손 '+descendantCount(s.id)+'개</span></div>'+
      (kids.length?'<div class="tree">'+treeHTML(s.id)+'</div>':'<div class="notice">아직 꼬리가 없습니다. 첫 분기를 만들어보세요.</div>')+
      '<button class="btn primary" style="width:100%;margin-top:12px" data-tail="'+esc(s.id)+'">이 작품 이어쓰기</button></section>'+
      '<section class="sec" id="comments"><div class="head"><h2>Comments</h2><span class="muted">익명</span></div><div class="commentbox"><input id="commentInput" maxlength="240" placeholder="가볍게 한마디"><button class="btn primary" data-addcomment="'+esc(s.id)+'">등록</button></div>'+
      (comments || '<div class="empty">첫 댓글을 남겨보세요.</div>')+'</section></main>';
  }

  function formHTML(parentId) {
    var p=parentId ? getStory(parentId) : null, options="", i, genreOptions="";
    if(p) for(i=0;i<tailTypes.length;i++) options += '<option>'+esc(tailTypes[i])+'</option>';
    if(!p) for(i=0;i<genres.length;i++) genreOptions += '<option>'+esc(genres[i])+'</option>';
    return '<main class="wrap"><button class="back" data-view="'+(p?'story':'home')+'">←</button><form class="form" id="storyForm">'+
      '<div class="head"><h2>'+(p?'꼬리 소설 쓰기':'새 작품 쓰기')+'</h2><span class="muted">'+(p?esc(p.title):'1분 안에 공개')+'</span></div>'+
      (p?'<div class="field"><label>꼬리 유형</label><select name="type">'+options+'</select></div>':'<div class="field"><label>작품 형태</label><div class="type-choice"><label><input type="radio" name="format" value="short" checked><span>단편</span></label><label><input type="radio" name="format" value="series"><span>시리즈</span></label></div></div>')+
      '<div class="field"><label>'+(p?'제목 *':'작품 제목 *')+'</label><input name="title" required maxlength="80"></div>'+
      (!p?'<div class="field hidden" id="seriesTitleField"><label>1화 제목 *</label><input name="episodeTitle" maxlength="70" placeholder="예: 첫 번째 승객"></div>':'')+
      (!p?'<div class="field"><label>장르</label><select name="genre">'+genreOptions+'</select></div>':'')+
      '<div class="field"><label>필명 <span class="muted">선택</span></label><input name="pen" maxlength="30" placeholder="비우면 익명"></div>'+
      '<div class="field"><label>한 줄 소개</label><input name="desc" maxlength="120"></div>'+
      '<div class="field"><label>본문 *</label><textarea name="body" required placeholder="생각난 이야기를 바로 적어보세요."></textarea></div>'+
      '<button class="btn primary" style="width:100%">게시</button></form></main>';
  }

  function mineHTML() {
    var ids=[], arr=[], cards="", i, raw;
    try { raw=localStorage.getItem(MINE_KEY); ids=raw?JSON.parse(raw):[]; } catch(e) {}
    for(i=0;i<data.length;i++) {
      if(ids.indexOf(data[i].id)===-1) continue;
      if(isSeriesEpisode(data[i]) && data[i].episode!==1) continue;
      arr.push(data[i]);
    }
    for(i=0;i<arr.length;i++) cards += cardHTML(arr[i],0);
    return '<main class="wrap"><div class="head"><h2>My Stories</h2><span class="muted">이 Safari에서 작성</span></div><div class="notice">현재 테스트판은 서버 DB 없이 이 브라우저에 저장됩니다.</div><div class="list sec">'+(cards||'<div class="empty">아직 작성한 작품이 없습니다.</div>')+'</div></main>';
  }

  function render() {
    var app=document.getElementById("app");
    if(!app) return;
    if(state.view==="home") app.innerHTML=homeHTML();
    else if(state.view==="find") app.innerHTML=findHTML();
    else if(state.view==="series") app.innerHTML=seriesHTML();
    else if(state.view==="serieswrite") app.innerHTML=seriesEpisodeForm(state.selected);
    else if(state.view==="story") app.innerHTML=storyHTML();
    else if(state.view==="write") app.innerHTML=formHTML(null);
    else if(state.view==="tail") app.innerHTML=formHTML(state.selected);
    else if(state.view==="mine") app.innerHTML=mineHTML();
    updateNav();
  }

  function updateNav() {
    var buttons=document.querySelectorAll("#bottomNav .nav"),i;
    for(i=0;i<buttons.length;i++) {
      if(buttons[i].getAttribute("data-view")===state.view) buttons[i].classList.add("on");
      else buttons[i].classList.remove("on");
    }
  }

  function go(view) {
    if(view==="story" && !state.selected) view="home";
    state.view=view;
    window.scrollTo(0,0);
    render();
  }

  function randomStory() {
    if(!data.length) return;
    var s=data[Math.floor(Math.random()*data.length)];
    openStory(s.id);
  }

  function openSeries(seriesId) {
    var eps=seriesEpisodes(seriesId);
    if(!eps.length) return;
    state.selected=eps[0].id;
    go("series");
  }

  function openStory(id) {
    var s=getStory(id);
    if(!s) return;
    s.views++;
    saveData();
    state.selected=id;
    go("story");
  }

  function submitStory(form) {
    var p=state.view==="tail"?getStory(state.selected):null;
    var fd=new FormData(form), id="s"+Date.now()+Math.floor(Math.random()*10000);
    var title=String(fd.get("title")||"").trim();
    var body=String(fd.get("body")||"").trim();
    if(!title || !body) return;
    if(!p && String(fd.get("format")||"short")==="series") {
      var epTitle=String(fd.get("episodeTitle")||"").trim();
      if(!epTitle) return;
      var seriesId="series"+Date.now()+Math.floor(Math.random()*1000);
      var root={
        id:id,p:null,root:id,format:"series",official:true,seriesId:seriesId,seriesTitle:title,episode:1,type:null,
        title:"1화. "+epTitle,genre:String(fd.get("genre")||"기타"),
        pen:String(fd.get("pen")||"").trim() || ("익명 "+Math.floor(1000+Math.random()*9000)),
        desc:String(fd.get("desc")||"").trim() || "새로운 시리즈",body:body,views:0,likes:0,date:Date.now(),comments:[]
      };
      data.unshift(root); saveData(); addMine(id); state.selected=id; go("series"); return;
    }
    var story={
      id:id,p:p?p.id:null,root:p?p.root:id,format:p?"tail":"short",official:false,type:p?String(fd.get("type")||"다음 화"):null,
      title:title,genre:p?p.genre:String(fd.get("genre")||"기타"),seriesId:p&&p.seriesId?p.seriesId:null,
      pen:String(fd.get("pen")||"").trim() || ("익명 "+Math.floor(1000+Math.random()*9000)),
      desc:String(fd.get("desc")||"").trim() || "새로운 이야기",
      body:body,views:0,likes:0,date:Date.now(),comments:[]
    };
    data.unshift(story); saveData(); addMine(id); state.selected=id; go("story");
  }

  function submitSeriesEpisode(form) {
    var root=getStory(state.selected);
    if(!root || !isSeriesRoot(root) || !ownsStory(root.id)) return;
    var eps=seriesEpisodes(root.seriesId), next=eps.length+1, fd=new FormData(form);
    var epTitle=String(fd.get("episodeTitle")||"").trim(), body=String(fd.get("body")||"").trim();
    if(!epTitle || !body) return;
    var id="s"+Date.now()+Math.floor(Math.random()*10000);
    var ep={id:id,p:null,root:root.id,format:"series",official:true,seriesId:root.seriesId,seriesTitle:root.seriesTitle,episode:next,type:null,
      title:next+"화. "+epTitle,genre:root.genre,pen:root.pen,desc:"",body:body,views:0,likes:0,date:Date.now(),comments:[]};
    data.unshift(ep); saveData(); addMine(id); state.selected=root.id; go("series");
  }

  document.addEventListener("click", function(e){
    var t=e.target;
    while(t && t!==document.body) {
      if(t.getAttribute) {
        if(t.getAttribute("data-view")) { go(t.getAttribute("data-view")); return; }
        if(t.getAttribute("data-series")) { openSeries(t.getAttribute("data-series")); return; }
        if(t.getAttribute("data-seriesnext")) { state.selected=t.getAttribute("data-seriesnext"); go("serieswrite"); return; }
        if(t.getAttribute("data-story")) { openStory(t.getAttribute("data-story")); return; }
        if(t.getAttribute("data-random")) { randomStory(); return; }
        if(t.getAttribute("data-rank")) { state.rank=t.getAttribute("data-rank"); render(); return; }
        if(t.getAttribute("data-genre")) { state.genre=t.getAttribute("data-genre"); render(); return; }
        if(t.getAttribute("data-like")) { var s=getStory(t.getAttribute("data-like")); if(s){s.likes++;saveData();render();} return; }
        if(t.getAttribute("data-tail")) { state.selected=t.getAttribute("data-tail"); go("tail"); return; }
        if(t.getAttribute("data-comments")) { var c=document.getElementById("comments"); if(c)c.scrollIntoView(); return; }
        if(t.getAttribute("data-addcomment")) {
          var inp=document.getElementById("commentInput"), txt=inp?inp.value.trim():"", cs=getStory(t.getAttribute("data-addcomment"));
          if(txt && cs){cs.comments.push(["익명 "+Math.floor(1000+Math.random()*9000),txt]);saveData();render();}
          return;
        }
      }
      t=t.parentNode;
    }
  });

  document.addEventListener("input", function(e){
    if(e.target && e.target.id==="searchInput") {
      state.query=e.target.value;
      render();
      var input=document.getElementById("searchInput");
      if(input){input.focus(); input.setSelectionRange(input.value.length,input.value.length);}
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target && e.target.id==="storyForm") {
      e.preventDefault();
      submitStory(e.target);
    } else if(e.target && e.target.id==="seriesEpisodeForm") {
      e.preventDefault();
      submitSeriesEpisode(e.target);
    }
  });
  document.addEventListener("change", function(e){
    if(e.target && e.target.name==="format") {
      var field=document.getElementById("seriesTitleField");
      if(field) {
        if(e.target.value==="series") field.classList.remove("hidden");
        else field.classList.add("hidden");
      }
    }
  });


  var randomTop=document.getElementById("randomTop");
  if(randomTop) randomTop.addEventListener("click",randomStory);

  ensureDemoSeries();
  render();
})();
</script>
</body>
</html>
